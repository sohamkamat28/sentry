<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 664" width="880" height="664" font-family="Helvetica, Arial, sans-serif">
  <rect width="880" height="664" fill="#ffffff"/>

  <!-- ── Reference estate ───────────────────────────────────────────── -->
  <rect x="24" y="24" width="832" height="118" rx="4" fill="#f6f8fa" stroke="#57606a" stroke-width="1.2"/>
  <text x="40" y="46" font-size="12" font-weight="bold" fill="#24292f" letter-spacing="1.2">REFERENCE ESTATE — a separate compose project, no shared volume, no database access</text>
  <text x="40" y="66" font-size="11.5" fill="#57606a">12 containerised services, each serving TLS on :8443 through Python's ssl — which is OpenSSL, which is what makes the uprobes fire. 11 REST + 1 SOAP.</text>

  <g font-size="10.5" fill="#24292f">
    <rect x="40"  y="80" width="104" height="22" rx="3" fill="#ffffff" stroke="#8c959f"/><text x="92"  y="95" text-anchor="middle">core-accounts</text>
    <rect x="152" y="80" width="86"  height="22" rx="3" fill="#ffffff" stroke="#8c959f"/><text x="195" y="95" text-anchor="middle">kyc-service</text>
    <rect x="246" y="80" width="98"  height="22" rx="3" fill="#ffffff" stroke="#8c959f"/><text x="295" y="95" text-anchor="middle">payments-upi</text>
    <rect x="352" y="80" width="104" height="22" rx="3" fill="#ffffff" stroke="#8c959f"/><text x="404" y="95" text-anchor="middle">settlement-rtgs</text>
    <rect x="464" y="80" width="102" height="22" rx="3" fill="#ffffff" stroke="#8c959f"/><text x="515" y="95" text-anchor="middle">finacle-bridge</text>
    <rect x="574" y="80" width="86"  height="22" rx="3" fill="#ffffff" stroke="#8c959f"/><text x="617" y="95" text-anchor="middle">cards-auth</text>
    <rect x="668" y="80" width="86"  height="22" rx="3" fill="#ffffff" stroke="#8c959f"/><text x="711" y="95" text-anchor="middle">+ 5 more</text>
    <rect x="40"  y="108" width="150" height="24" rx="3" fill="#ffffff" stroke="#cf222e" stroke-width="1.6" stroke-dasharray="4 2"/>
    <text x="115" y="124" text-anchor="middle" fill="#cf222e" font-weight="bold">shadow-fx-rate</text>
    <text x="200" y="124" fill="#cf222e">in no gateway, in no repository, called only service-to-service — the blind spot the sensor has to find</text>
  </g>

  <!-- estate → agent -->
  <path d="M440 142 L440 176" stroke="#57606a" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="450" y="164" font-size="11" fill="#57606a">plaintext, read at the TLS boundary</text>

  <!-- ── Sensing plane ─────────────────────────────────────────────── -->
  <rect x="24" y="180" width="832" height="86" rx="4" fill="#fff8f0" stroke="#bc4c00" stroke-width="1.2"/>
  <text x="40" y="200" font-size="12" font-weight="bold" fill="#bc4c00" letter-spacing="1.2">SENSING PLANE</text>

  <rect x="176" y="210" width="216" height="44" rx="3" fill="#ffffff" stroke="#bc4c00" stroke-width="1.4"/>
  <text x="284" y="228" font-size="12" font-weight="bold" fill="#24292f" text-anchor="middle">eBPF agent (Go + C)</text>
  <text x="284" y="244" font-size="10.5" fill="#57606a" text-anchor="middle">uprobes · 11 programs · 9 maps</text>

  <rect x="470" y="210" width="180" height="44" rx="3" fill="#ffffff" stroke="#8c959f"/>
  <text x="560" y="228" font-size="12" font-weight="bold" fill="#24292f" text-anchor="middle">ingest (Go)</text>
  <text x="560" y="244" font-size="10.5" fill="#57606a" text-anchor="middle">batched writes, backpressure</text>

  <path d="M392 232 L466 232" stroke="#57606a" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="429" y="224" font-size="10" fill="#57606a" text-anchor="middle">JSON</text>
  <text x="672" y="228" font-size="10.5" fill="#bc4c00">the only privileged container:</text>
  <text x="672" y="243" font-size="10.5" fill="#bc4c00">pid:host, cgroup:host, /sys/fs/bpf</text>

  <path d="M560 254 L560 292" stroke="#57606a" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="570" y="278" font-size="10.5" fill="#57606a">COPY</text>

  <!-- ── Control plane ─────────────────────────────────────────────── -->
  <rect x="24" y="296" width="832" height="334" rx="4" fill="#f6f8fa" stroke="#57606a" stroke-width="1.2"/>
  <text x="40" y="316" font-size="12" font-weight="bold" fill="#24292f" letter-spacing="1.2">CONTROL PLANE</text>

  <rect x="380" y="330" width="360" height="42" rx="3" fill="#ffffff" stroke="#24292f" stroke-width="1.4"/>
  <text x="560" y="348" font-size="12" font-weight="bold" fill="#24292f" text-anchor="middle">PostgreSQL 16 — 30 tables, one writing stage per column</text>
  <text x="560" y="363" font-size="10.5" fill="#57606a" text-anchor="middle">plus a second database for Kong's own state</text>

  <rect x="60" y="404" width="250" height="76" rx="3" fill="#ffffff" stroke="#8c959f"/>
  <text x="185" y="424" font-size="12" font-weight="bold" fill="#24292f" text-anchor="middle">worker — Celery + beat</text>
  <text x="185" y="441" font-size="10.5" fill="#57606a" text-anchor="middle">the 14-stage pipeline, on a schedule</text>
  <text x="185" y="456" font-size="10.5" fill="#57606a" text-anchor="middle">collectors · engines · actuators · Judge</text>
  <text x="185" y="471" font-size="10.5" fill="#57606a" text-anchor="middle">Redis lock serialises every cycle</text>

  <rect x="360" y="404" width="220" height="76" rx="3" fill="#ffffff" stroke="#8c959f"/>
  <text x="470" y="424" font-size="12" font-weight="bold" fill="#24292f" text-anchor="middle">api — FastAPI</text>
  <text x="470" y="441" font-size="10.5" fill="#57606a" text-anchor="middle">53 REST paths, every one</text>
  <text x="470" y="456" font-size="10.5" fill="#57606a" text-anchor="middle">declaring a response schema</text>
  <text x="470" y="471" font-size="10.5" fill="#57606a" text-anchor="middle">RBAC · hash-chained audit ledger</text>

  <rect x="630" y="404" width="180" height="76" rx="3" fill="#ffffff" stroke="#8c959f"/>
  <text x="720" y="424" font-size="12" font-weight="bold" fill="#24292f" text-anchor="middle">console — React</text>
  <text x="720" y="441" font-size="10.5" fill="#57606a" text-anchor="middle">14 operator surfaces</text>
  <text x="720" y="456" font-size="10.5" fill="#57606a" text-anchor="middle">types generated from the</text>
  <text x="720" y="471" font-size="10.5" fill="#57606a" text-anchor="middle">control plane's own schema</text>

  <path d="M470 372 L470 400" stroke="#57606a" stroke-width="1.2" marker-end="url(#a)"/>
  <path d="M420 372 L200 400" stroke="#57606a" stroke-width="1.2" marker-end="url(#a)"/>
  <path d="M580 442 L626 442" stroke="#57606a" stroke-width="1.2" marker-end="url(#a)"/>

  <!-- actuated infrastructure -->
  <g font-size="10.5">
    <rect x="60"  y="528" width="176" height="56" rx="3" fill="#ffffff" stroke="#8c959f"/>
    <text x="148" y="546" font-size="11.5" font-weight="bold" fill="#24292f" text-anchor="middle">Kong 3.8 — DB-backed</text>
    <text x="148" y="561" fill="#57606a" text-anchor="middle">rate limits, TLS floor, masking,</text>
    <text x="148" y="574" fill="#57606a" text-anchor="middle">key-auth, 410 at retirement</text>

    <rect x="252" y="528" width="164" height="56" rx="3" fill="#ffffff" stroke="#8c959f"/>
    <text x="334" y="546" font-size="11.5" font-weight="bold" fill="#24292f" text-anchor="middle">MinIO — Object Lock</text>
    <text x="334" y="561" fill="#57606a" text-anchor="middle">COMPLIANCE mode, retention</text>
    <text x="334" y="574" fill="#57606a" text-anchor="middle">to 2033; deletes refused</text>

    <rect x="432" y="528" width="150" height="56" rx="3" fill="#ffffff" stroke="#8c959f"/>
    <text x="507" y="546" font-size="11.5" font-weight="bold" fill="#24292f" text-anchor="middle">Keycloak 26</text>
    <text x="507" y="561" fill="#57606a" text-anchor="middle">four-rung role ladder;</text>
    <text x="507" y="574" fill="#57606a" text-anchor="middle">analyst cannot apply</text>

    <rect x="598" y="528" width="120" height="56" rx="3" fill="#ffffff" stroke="#8c959f"/>
    <text x="658" y="546" font-size="11.5" font-weight="bold" fill="#24292f" text-anchor="middle">rsyslog</text>
    <text x="658" y="561" fill="#57606a" text-anchor="middle">CEF over TCP,</text>
    <text x="658" y="574" fill="#57606a" text-anchor="middle">bounded spool</text>

    <rect x="734" y="528" width="80" height="56" rx="3" fill="#ffffff" stroke="#8c959f"/>
    <text x="774" y="546" font-size="11.5" font-weight="bold" fill="#24292f" text-anchor="middle">honeypot</text>
    <text x="774" y="561" fill="#57606a" text-anchor="middle">serves retired</text>
    <text x="774" y="574" fill="#57606a" text-anchor="middle">routes as traps</text>
  </g>

  <path d="M150 480 L148 524" stroke="#57606a" stroke-width="1.2" marker-end="url(#a)"/>
  <path d="M200 480 L330 524" stroke="#57606a" stroke-width="1.2" marker-end="url(#a)"/>
  <path d="M240 480 L500 524" stroke="#57606a" stroke-width="1.2" marker-end="url(#a)"/>
  <path d="M280 480 L650 524" stroke="#57606a" stroke-width="1.2" marker-end="url(#a)"/>

  <text x="440" y="600" font-size="10.5" font-weight="bold" fill="#24292f" text-anchor="middle">Every control above is applied through a live Admin API and confirmed by the id that comes back — never simulated.</text>
  <text x="440" y="617" font-size="10.5" fill="#57606a" text-anchor="middle">Kong proxies the estate on :8000 / :8443, so a control the worker applies is enforced on the same traffic the sensor is watching.</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
  </defs>
</svg>
