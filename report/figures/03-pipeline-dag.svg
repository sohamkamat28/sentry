<text x="28" y="30" font-size="17" font-weight="bold" fill="#24292f" letter-spacing="1.1">THE 14-STAGE PIPELINE — the dependency graph, read from STAGE_DEPS</text>
<text x="28" y="50" font-size="14" fill="#57606a">Columns are dependency depth; an arrow points from a stage to one that needs it. Execution order is a topological sort, tie-broken by stage number so a run is reproducible.</text>
<text x="28" y="66" font-size="14" fill="#57606a">A stage that raises is recorded and skipped, its dependants are skipped with a stated reason, and the cycle completes and reports partial.</text>
