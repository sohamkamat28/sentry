<text x="63" y="457" font-size="10" fill="#8c959f" font-weight="bold" letter-spacing="0.6">14</text>
<text x="110" y="473" font-size="12.5" fill="#24292f" text-anchor="middle">Operations</text>
<text x="26" y="628" font-size="10" fill="#57606a">Execution order is a topological sort tie-broken by stage number, so a run is reproducible.</text>
<text x="26" y="642" font-size="10" fill="#57606a">A stage that raises is recorded and skipped with its dependants; the cycle reports partial.</text>
<text x="26" y="656" font-size="10" fill="#57606a">03 precedes 02 and 05 precedes 06, correcting the specification this was built from.</text>
