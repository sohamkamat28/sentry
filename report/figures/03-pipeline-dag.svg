<text x="26" y="30" font-size="13" font-weight="bold" fill="#24292f" letter-spacing="0.6">THE 14-STAGE PIPELINE — the dependency graph, from STAGE_DEPS</text>
<text x="26" y="50" font-size="10.5" fill="#57606a">Top to bottom is dependency depth; an arrow points from a stage to one that needs it.</text>
<text x="26" y="64" font-size="10.5" fill="#57606a">Only the 16 edges that constrain ordering are drawn. Six of the 22 declared are implied</text>
<text x="26" y="78" font-size="10.5" fill="#57606a">by a longer path — 10 needs 6, but 6 → 8 → 10 already says so — and are left out.</text>
