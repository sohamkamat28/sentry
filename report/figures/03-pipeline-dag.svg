<text x="540.0" y="88" font-size="12.5" fill="#cf222e">stage 07 writes pre_zombie back onto the stage-04 record — not a dependency</text>
<rect x="28" y="120" width="104" height="40" rx="3" fill="#ffffff" stroke="#24292f" stroke-width="1.2"/>
<text x="36" y="135" font-size="12.5" font-weight="bold" fill="#8c959f">01</text>
<text x="80.0" y="150" font-size="14" fill="#24292f" text-anchor="middle">Sensor Grid</text>
<rect x="328" y="120" width="104" height="40" rx="3" fill="#ffffff" stroke="#24292f" stroke-width="1.2"/>
