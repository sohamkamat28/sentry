<text x="1088.0" y="114" font-size="10.5" fill="#24292f" text-anchor="middle">Zero-Trust</text>
<rect x="784" y="160" width="104" height="40" rx="3" fill="#ffffff" stroke="#24292f" stroke-width="1.2"/>
<text x="792" y="175" font-size="9.5" font-weight="bold" fill="#8c959f">14</text>
<text x="836.0" y="190" font-size="10.5" fill="#24292f" text-anchor="middle">Operations</text>
<text x="28" y="344" font-size="10.5" fill="#cf222e">Dashed red: stage 07 writes pre_zombie back onto the stage-04 record. It is not an edge in the graph — 04 does not depend on 07 — so it is drawn as what it is: a write-back.</text>
<text x="28" y="362" font-size="10.5" fill="#57606a">Two orderings correct the specification this was built from. 03 precedes 02 because the daily rollup aggregates by an endpoint identity that correlation produces.</text>
<text x="28" y="378" font-size="10.5" fill="#57606a">05 precedes 06 because the CDRI formula consumes a behavioural anomaly term; the reverse would have a stage read an input from its own future.</text>
</svg>