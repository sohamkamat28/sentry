<text x="680.0" y="290" font-size="14" fill="#24292f" text-anchor="middle">Decommission</text>
<rect x="778" y="190" width="104" height="40" rx="3" fill="#ffffff" stroke="#24292f" stroke-width="1.2"/>
<text x="786" y="205" font-size="12.5" font-weight="bold" fill="#8c959f">12</text>
<text x="830.0" y="220" font-size="14" fill="#24292f" text-anchor="middle">Threat</text>
<rect x="1228" y="120" width="104" height="40" rx="3" fill="#ffffff" stroke="#24292f" stroke-width="1.2"/>
<text x="1236" y="135" font-size="12.5" font-weight="bold" fill="#8c959f">13</text>
<text x="1280.0" y="150" font-size="14" fill="#24292f" text-anchor="middle">Zero-Trust</text>
<rect x="928" y="190" width="104" height="40" rx="3" fill="#ffffff" stroke="#24292f" stroke-width="1.2"/>
<text x="936" y="205" font-size="12.5" font-weight="bold" fill="#8c959f">14</text>
<text x="980.0" y="220" font-size="14" fill="#24292f" text-anchor="middle">Operations</text>
<text x="28" y="420" font-size="14" fill="#57606a">Edges spanning more than one column drop into the lanes below and rise into their target, so no arrow crosses a box it has nothing to do with.</text>
<text x="28" y="438" font-size="14" fill="#57606a">Two orderings correct the specification this was built from. 03 precedes 02 because the daily rollup aggregates by an endpoint identity that correlation produces.</text>
<text x="28" y="454" font-size="14" fill="#57606a">05 precedes 06 because the CDRI formula consumes a behavioural anomaly term; the reverse would have a stage read an input from its own future.</text>
