<text x="1086" y="135" font-size="12.5" font-weight="bold" fill="#8c959f">10</text>
<text x="1130.0" y="150" font-size="14" fill="#24292f" text-anchor="middle">Remediation</text>
<rect x="628" y="260" width="104" height="40" rx="3" fill="#ffffff" stroke="#24292f" stroke-width="1.2"/>
