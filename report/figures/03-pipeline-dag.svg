<text x="710.0" y="190" font-size="10.5" fill="#24292f" text-anchor="middle">Threat</text>
<rect x="1036" y="84" width="104" height="40" rx="3" fill="#ffffff" stroke="#24292f" stroke-width="1.2"/>
