<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="Helvetica, Arial, sans-serif">
  <rect width="880" height="470" fill="#ffffff"/>

  <!-- userspace: the watched process -->
  <rect x="24" y="26" width="352" height="120" rx="4" fill="#f6f8fa" stroke="#57606a" stroke-width="1.2"/>
  <text x="40" y="46" font-size="11.5" font-weight="bold" fill="#24292f" letter-spacing="1.1">WATCHED PROCESS — unmodified</text>
  <text x="40" y="66" font-size="11" fill="#57606a">A banking service. No agent, no sidecar, no library shim,</text>
  <text x="40" y="81" font-size="11" fill="#57606a">no code change. It does not know it is observed.</text>
  <rect x="40" y="94" width="320" height="38" rx="3" fill="#ffffff" stroke="#8c959f"/>
  <text x="200" y="110" font-size="11.5" font-family="monospace" fill="#24292f" text-anchor="middle">SSL_write(ssl, buf, len)</text>
  <text x="200" y="125" font-size="10" fill="#57606a" text-anchor="middle">plaintext is in buf — before encryption, after decryption</text>

  <!-- kernel boundary -->
  <line x1="24" y1="162" x2="856" y2="162" stroke="#24292f" stroke-width="1.6" stroke-dasharray="7 4"/>
  <text x="30" y="157" font-size="10.5" font-weight="bold" fill="#24292f">USERSPACE</text>
  <text x="30" y="177" font-size="10.5" font-weight="bold" fill="#bc4c00">KERNEL</text>

  <path d="M200 146 L200 190" stroke="#bc4c00" stroke-width="1.6" marker-end="url(#b)"/>
  <text x="210" y="180" font-size="10.5" fill="#bc4c00">uprobe fires</text>

  <!-- kernel plane -->
  <rect x="24" y="194" width="600" height="176" rx="4" fill="#fff8f0" stroke="#bc4c00" stroke-width="1.2"/>
  <text x="40" y="214" font-size="11.5" font-weight="bold" fill="#bc4c00" letter-spacing="1.1">eBPF PROGRAM — everything below happens in kernel, before any copy</text>

  <rect x="40" y="226" width="164" height="52" rx="3" fill="#ffffff" stroke="#8c959f"/>
  <text x="122" y="243" font-size="11" font-weight="bold" fill="#24292f" text-anchor="middle">1 · filter</text>
  <text x="122" y="258" font-size="10" fill="#57606a" text-anchor="middle">approver ports, then</text>
  <text x="122" y="270" font-size="10" fill="#57606a" text-anchor="middle">FNV-1a discarders</text>

  <rect x="216" y="226" width="176" height="52" rx="3" fill="#ffffff" stroke="#8c959f"/>
  <text x="304" y="243" font-size="11" font-weight="bold" fill="#24292f" text-anchor="middle">2 · classify</text>
  <text x="304" y="258" font-size="10" fill="#57606a" text-anchor="middle">PAN · Aadhaar · IFSC · CVV</text>
  <text x="304" y="270" font-size="10" fill="#57606a" text-anchor="middle">bpf_loop, 256-byte budget</text>

  <rect x="404" y="226" width="200" height="52" rx="3" fill="#ffffff" stroke="#8c959f"/>
  <text x="504" y="243" font-size="11" font-weight="bold" fill="#24292f" text-anchor="middle">3 · extract field names</text>
  <text x="504" y="258" font-size="10" fill="#57606a" text-anchor="middle">JSON keys only — the value is</text>
  <text x="504" y="270" font-size="10" fill="#57606a" text-anchor="middle">rewound out before the next token</text>

  <path d="M204 252 L212 252" stroke="#57606a" stroke-width="1.3" marker-end="url(#b)"/>
  <path d="M392 252 L400 252" stroke="#57606a" stroke-width="1.3" marker-end="url(#b)"/>

  <!-- the privacy statement -->
  <rect x="40" y="290" width="584" height="62" rx="3" fill="#ffffff" stroke="#cf222e" stroke-width="1.4"/>
  <text x="52" y="308" font-size="11" font-weight="bold" fill="#cf222e">What never leaves the kernel</text>
  <text x="52" y="325" font-size="10.5" fill="#24292f">The response body is scanned and discarded in place. Field <tspan font-weight="bold">names</tspan> are schema and are carried out; field</text>
  <text x="52" y="340" font-size="10.5" fill="#24292f"><tspan font-weight="bold">values</tspan> are not copied, not hashed, not counted. A token that resolves to a value is rewound before the next byte is read.</text>

  <!-- ringbuf -->
  <path d="M624 252 L672 252" stroke="#57606a" stroke-width="1.4" marker-end="url(#b)"/>
  <rect x="676" y="226" width="164" height="52" rx="3" fill="#ffffff" stroke="#bc4c00" stroke-width="1.4"/>
  <text x="758" y="246" font-size="11" font-weight="bold" fill="#24292f" text-anchor="middle">ring buffer — 4 MB</text>
  <text x="758" y="262" font-size="10" fill="#57606a" text-anchor="middle">loss counted, never silent</text>

  <path d="M758 278 L758 322" stroke="#57606a" stroke-width="1.4" marker-end="url(#b)"/>
  <text x="768" y="304" font-size="10.5" fill="#57606a">drained per-CPU</text>

  <!-- userspace agent -->
  <rect x="660" y="326" width="196" height="52" rx="3" fill="#ffffff" stroke="#8c959f"/>
  <text x="758" y="346" font-size="11" font-weight="bold" fill="#24292f" text-anchor="middle">agent (Go, userspace)</text>
  <text x="758" y="362" font-size="10" fill="#57606a" text-anchor="middle">batch · cgroup → service name</text>

  <path d="M758 378 L758 408" stroke="#57606a" stroke-width="1.4" marker-end="url(#b)"/>

  <rect x="640" y="412" width="216" height="42" rx="3" fill="#ffffff" stroke="#8c959f"/>
  <text x="748" y="430" font-size="11" font-weight="bold" fill="#24292f" text-anchor="middle">ingest → PostgreSQL</text>
  <text x="748" y="445" font-size="10" fill="#57606a" text-anchor="middle">one observation row per captured call</text>

  <!-- verifier note -->
  <rect x="24" y="386" width="596" height="68" rx="4" fill="#f6f8fa" stroke="#8c959f"/>
  <text x="40" y="405" font-size="11" font-weight="bold" fill="#24292f">Why the loops are bounded</text>
  <text x="40" y="422" font-size="10.5" fill="#57606a">A rolled 256-iteration loop with branches in its body was 625 instructions, and the verifier walked 1,000,001 paths</text>
  <text x="40" y="436" font-size="10.5" fill="#57606a">— one over its limit. Rewritten with bpf_loop, masked loads and a compiler barrier, it is accepted by clang 19 and 22</text>
  <text x="40" y="450" font-size="10.5" fill="#57606a">alike. Acceptance became a property of the program rather than of the toolchain that happened to build it.</text>

  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
  </defs>
</svg>
