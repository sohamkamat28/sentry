server {
    listen 80;
    # And on IPv6. `localhost` inside this image resolves to ::1 before
    # 127.0.0.1, so an IPv4-only bind answered every request the published port
    # forwarded and refused the container's own healthcheck — which reported the
    # console unhealthy for its whole lifetime while it served 200 to everyone
    # else. Under compose that is cosmetic; a `depends_on: service_healthy` on
    # this service, or a probe that dials by name, would never have come up.
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;

    # Hashed asset filenames, so these are immutable for as long as they exist.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The router owns every path. Without this, a reload on /endpoints/abc123
    # asks nginx for a file that was never built and returns 404 — the console
    # would work only if the operator never refreshed and never used a link.
    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }

    # The bundle talks to the control plane cross-origin and the API sets CORS
    # for it, so nothing is proxied here. Declared rather than assumed: a proxy
    # pass added later would make the console's origin a bearer-token relay.

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy no-referrer;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
