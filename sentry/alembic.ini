# Alembic configuration.
#
# The database URL is deliberately absent. It comes from DATABASE_URL through
# sentry_core.config, which is the same setting every other process reads — a
# second copy here would let migrations run against one database while the API
# runs against another, and the failure would look like missing data rather
# than a misconfiguration.
[alembic]
script_location = api/migrations
prepend_sys_path = .

# Revision filenames sort chronologically, so `ls versions/` reads as history.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
