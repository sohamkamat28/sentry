apiVersion: v1
kind: Namespace
metadata:
  name: sentry
  labels:
    # The agent needs privileged + hostPID, so this namespace cannot run under
    # the restricted profile. Labelled explicitly rather than left to fail at
    # admission with a message about a pod nobody expected to be privileged.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
