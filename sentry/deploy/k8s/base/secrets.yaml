# Stubs. No credential value is committed.
#
# config.py refuses to start in prod when AUTH_DISABLED is true, when
# OIDC_ISSUER is unset, when DATABASE_URL carries the default credentials, or
# when any of KONG_ADMIN_TOKEN / MINIO_SECRET_KEY / SERVICENOW_PASSWORD is a
# placeholder. A deployment that applied this base without wiring a real secret
# store therefore fails at boot with a named reason rather than running.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: sentry-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: sentry-secret-store
    kind: SecretStore
  target:
    name: sentry-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef: { key: sentry/database, property: url }
    - secretKey: OIDC_ISSUER
      remoteRef: { key: sentry/oidc, property: issuer }
    - secretKey: KONG_ADMIN_TOKEN
      remoteRef: { key: sentry/kong, property: admin_token }
    - secretKey: MINIO_ACCESS_KEY
      remoteRef: { key: sentry/minio, property: access_key }
    - secretKey: MINIO_SECRET_KEY
      remoteRef: { key: sentry/minio, property: secret_key }
    - secretKey: ANTHROPIC_API_KEY
      remoteRef: { key: sentry/anthropic, property: api_key }
    - secretKey: SERVICENOW_PASSWORD
      remoteRef: { key: sentry/servicenow, property: password }
