# SENTRY platform.
#
# The estate runs as a separate compose project (estate/compose.yaml) on the same
# external network. That separation is structural, not cosmetic: the estate has
# no route to SENTRY's database and shares no volume with it, so discovery has to
# actually discover rather than read.
name: sentry

networks:
  sentry-net:
    external: true

volumes:
  pgdata:
  miniodata:
  agentqueue:

# Kong-specific settings, shared by the gateway and its two bootstrap jobs.
#
# Database-backed, not DB-less. In declarative mode the entire Admin API is
# read-only — `POST /services` returns 405 "cannot create or update entities
# by name when not using a database" — and stage 10's virtual patch is
# nothing but Admin API writes. A gateway SENTRY cannot write to is a gateway
# against which the product's central claim cannot be demonstrated.
#
# kong.yaml is still the registry of record. It is imported into the database
# at bootstrap rather than mounted as live config, so the declared surface is
# identical and the runtime one is writable.
x-kong-env: &kongenv
  KONG_DATABASE: postgres
  KONG_PG_HOST: postgres
  KONG_PG_PORT: "5432"
  KONG_PG_USER: sentry
  KONG_PG_PASSWORD: ${POSTGRES_PASSWORD:-sentry}
  KONG_PG_DATABASE: kong


services:
  # ── infrastructure ────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sentry
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentry}
      POSTGRES_DB: sentry
    volumes: [pgdata:/var/lib/postgresql/data]
    # Not 5432: a developer machine usually has its own Postgres there, and a
    # port clash at `up` is a confusing first experience of the stack.
    ports: ["55432:5432"]
    networks: [sentry-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentry -d sentry"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    networks: [sentry-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # Kong needs its own database in the shared server. Kong's migrations create
  # the schema but not the database itself.
  kong-db-create:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-sentry}
    depends_on:
      postgres: { condition: service_healthy }
    networks: [sentry-net]
    restart: "no"
    entrypoint: ["sh", "-c", "psql -h postgres -U sentry -d sentry -tc \"SELECT 1 FROM pg_database WHERE datname='kong'\" | grep -q 1 || psql -h postgres -U sentry -d sentry -c 'CREATE DATABASE kong'"]

  kong-migrations:
    image: kong:3.8
    environment: *kongenv
    depends_on:
      kong-db-create: { condition: service_completed_successfully }
    networks: [sentry-net]
    restart: "no"
    command: ["kong", "migrations", "bootstrap"]

  # Imports the declared surface. `db_import` is idempotent on re-run and
  # replaces what is there, so the gateway always starts from kong.yaml and
  # anything SENTRY added since is re-applied by stage 10 rather than assumed.
  kong-import:
    image: kong:3.8
    environment: *kongenv
    volumes: ["../kong:/kong:ro"]
    depends_on:
      kong-migrations: { condition: service_completed_successfully }
    networks: [sentry-net]
    restart: "no"
    command: ["kong", "config", "db_import", "/kong/kong.yaml"]

  # Consumers and their credentials, provisioned idempotently.
  #
  # Separate from kong-import because `kong config db_import` raises a UNIQUE
  # violation on a key that already exists, so importing them declaratively made
  # every `docker compose up` after the first fail on a stack that was already
  # in the desired state. PUT is an upsert for the consumer; the credential POST
  # treats 409 as success.
  #
  # These keys are development values. config.py refuses to start in prod with a
  # placeholder secret, which is the check that stops them travelling.
  kong-consumers:
    image: curlimages/curl:latest
    depends_on:
      kong: { condition: service_healthy }
    networks: [sentry-net]
    restart: "no"
    # A YAML folded scalar joins these lines with spaces, so the loop body has to
    # be written on one line: a multi-line `for` folded into `... do ... done`
    # with the newlines removed is a shell syntax error, and the job exited 2
    # while reporting nothing about consumers.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        set -e; for u in payments-upi settlement-rtgs core-banking-batch partner-aggregator; do
        curl -sf -X PUT "http://kong:8001/consumers/$$u" --data "username=$$u" --data "tags[]=sentry:consumer" > /dev/null;
        code=$$(curl -s -o /dev/null -w '%{http_code}' -X POST "http://kong:8001/consumers/$$u/key-auth" --data "key=dev-key-$$u");
        case "$$code" in 2*|409) echo "consumer $$u ready ($$code)";; *) echo "consumer $$u failed: $$code"; exit 1;; esac;
        done

  # The second wave of estate services, provisioned idempotently.
  #
  # Separate from kong-import for the reason the consumers are separate:
  # `kong config db_import` assigns its own entity ids, so a service whose name
  # already exists raises a UNIQUE violation and takes the entire import down
  # with it — every service in kong.yaml, not just the conflicting one. Anything
  # that creates a service through the Admin API triggers it, and stage 10's
  # shadow pair and the canary both do.
  #
  # PUT by name is an upsert, so this is safe on the first run and on every one
  # after it.
  kong-services:
    image: curlimages/curl:latest
    depends_on:
      kong: { condition: service_healthy }
    networks: [sentry-net]
    restart: "no"
    # One line per entity: a YAML folded scalar joins these with spaces, so a
    # multi-line loop body becomes a shell syntax error.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        set -e;
        add() { curl -sf -X PUT "http://kong:8001/services/$$1" --data "url=$$2" --data "tags[]=$$3" -o /dev/null;
        curl -sf -X PUT "http://kong:8001/services/$$1/routes/$$4" --data "paths[]=$$5" --data "methods[]=POST" --data "strip_path=false" -o /dev/null;
        echo "service $$1 ready"; };
        add cards-auth https://cards-auth:8443 criticality:payment cards-authorise '~/api/v1/cards/authorise$$';
        add core-deposits https://core-deposits:8443 criticality:customer deposits-create '~/api/v1/deposits$$';
        add nostro-sync https://nostro-sync:8443 criticality:settlement nostro-sync-run '~/api/v1/nostro/sync$$';
        add partner-gateway https://partner-gateway:8443 criticality:payment partner-settle '~/api/v1/partner/settlement$$';
        add recon-quarterly https://recon-quarterly:8443 criticality:regulatory recon-statutory '~/api/v1/recon/statutory$$'

  kong:
    image: kong:3.8
    environment:
      <<: *kongenv
      KONG_PROXY_LISTEN: "0.0.0.0:8000, 0.0.0.0:8443 ssl"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      # Optional client certs: the OSS path to per-route mTLS enforcement, paired
      # with a pre-function that rejects unverified connections.
      KONG_NGINX_PROXY_SSL_VERIFY_CLIENT: optional_no_ca
    depends_on:
      kong-import: { condition: service_completed_successfully }
    ports: ["8000:8000", "8443:8443", "8001:8001"]
    networks: [sentry-net]
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sentry}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-sentry-minio}
    volumes: [miniodata:/data]
    ports: ["9000:9000", "9001:9001"]
    networks: [sentry-net]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 15

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_PORT: 8081
    volumes: ["../keycloak:/opt/keycloak/data/import:ro"]
    ports: ["8081:8081"]
    networks: [sentry-net]

  rsyslog:
    image: rsyslog/syslog_appliance_alpine
    ports: ["514:514/tcp", "514:514/udp"]
    networks: [sentry-net]

  # ── bootstrap (one-shot, ordered) ─────────────────────────────────────────
  # Every other service waits on this completing. The schema a deployment runs
  # against is whatever `upgrade head` produced, never whatever the models
  # happened to say when a process started.
  db-migrate:
    build: { context: ../.., dockerfile: api/Dockerfile }
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://sentry:${POSTGRES_PASSWORD:-sentry}@postgres:5432/sentry
    depends_on:
      postgres: { condition: service_healthy }
    networks: [sentry-net]
    restart: "no"

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    networks: [sentry-net]
    # Object Lock cannot be enabled on an existing bucket. Getting this wrong
    # means stage 11 archives to storage that permits deletion, so the worker
    # fails readyz rather than discovering it at the first retirement.
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-sentry} ${MINIO_ROOT_PASSWORD:-sentry-minio} &&
      (mc ls local/sentry-worm >/dev/null 2>&1 || mc mb --with-lock local/sentry-worm) &&
      mc retention set --default COMPLIANCE 7y local/sentry-worm &&
      echo 'worm bucket ready with object lock'
      "
    restart: "no"

  # ── SENTRY services ───────────────────────────────────────────────────────
  api:
    build: { context: ../.., dockerfile: api/Dockerfile }
    environment: &svcenv
      SENTRY_ENV: dev
      DATABASE_URL: postgresql+psycopg://sentry:${POSTGRES_PASSWORD:-sentry}@postgres:5432/sentry
      REDIS_URL: redis://redis:6379/0
      # The issuer as it appears in tokens — the address the *browser* used —
      # and the key endpoint as this container can reach it. They differ, and
      # conflating them breaks one side or the other: derive the key URL from
      # the issuer and the API dials localhost inside itself; set the issuer to
      # the reachable name and every real token fails on "Invalid issuer".
      OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:8081/realms/sentry}
      OIDC_JWKS_URL: http://keycloak:8081/realms/sentry/protocol/openid-connect/certs
      # The client the Judge authenticates as to measure an oauth2 control.
      #
      # Without a real token the Judge replays anonymously against a plugin whose
      # purpose is to reject anonymous callers, and the control is rejected on
      # the evidence that it works — the same defect that made key-auth
      # unjudgeable before a consumer existed.
      JUDGE_OIDC_CLIENT_ID: ${JUDGE_OIDC_CLIENT_ID:-sentry-judge}
      JUDGE_OIDC_CLIENT_SECRET: ${JUDGE_OIDC_CLIENT_SECRET:-dev-judge-secret-change-me}
      AUTH_DISABLED: ${AUTH_DISABLED:-true}
      KONG_ADMIN_URL: http://kong:8001
      KONG_PROXY_URL: http://kong:8000
      # Controls that read connection state are judged here instead. ssl_protocol
      # is empty on the plain listener, so a tls-min pre-function rejects every
      # request over :8000 and the measurement describes a transport no caller
      # uses.
      KONG_PROXY_TLS_URL: https://kong:8443
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-sentry}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-sentry-minio}
      WORM_BUCKET: sentry-worm
      SIEM_HOST: rsyslog
      SIEM_PORT: "514"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      VCLOCK_SCALE_SECONDS: ${VCLOCK_SCALE_SECONDS:-30}
      # Retention is measured in vdays, and the 400-vday default assumes a vday
      # is a calendar day. At a compressed scale it is not: at 10s/vday the
      # window is about 67 minutes of wall time, which prunes an endpoint's
      # history before its own retirement completes — and a fingerprint
      # captured afterwards is built from nothing. Scaled up here so a
      # demonstration run outlives its own evidence.
      OBSERVATION_RETENTION_VDAYS: ${OBSERVATION_RETENTION_VDAYS:-100000}
      CORS_ORIGINS: http://localhost:5173
      # Stage 01's non-kernel collectors. These are coverage claims: an endpoint
      # is only "absent from code" with respect to the repositories named here,
      # so an unset value makes every endpoint look undeclared rather than
      # unchecked. The collector reports unconfigured instead of empty.
      CODE_REPO_PATHS: /repos/core-accounts,/repos/kyc-service,/repos/payments-upi,/repos/settlement-rtgs
      LEGACY_WSDL_URLS: https://finacle-bridge:8443/finacle/CustomerService?wsdl
      # Where the estate publishes its own REST contracts.
      #
      # Listed rather than discovered: probing every observed host for
      # /openapi.json would have SENTRY issuing unsolicited requests across the
      # estate it is measuring, and those requests are traffic the sensor then
      # captures as usage.
      OPENAPI_DOCUMENT_URLS: >-
        https://cards-auth:8443/openapi.json,
        https://core-deposits:8443/openapi.json,
        https://nostro-sync:8443/openapi.json,
        https://partner-gateway:8443/openapi.json,
        https://recon-quarterly:8443/openapi.json
      LEGACY_REGISTRY_PATH: /registry/finacle-interfaces.csv
      # Rung 4 of the ownership ladder. Unset, the employment question is never
      # asked and a departed owner stays on the record looking reachable — which
      # is worse than no owner, because it reads as resolved on every report
      # while the escalation goes nowhere.
      HR_DIRECTORY_SOURCE: /hr/directory.json
      DEFAULT_DEPARTMENT_HEAD: elena.rossi@bank.example
      # Where the gateway sends a retired path once the honeypot is activated.
      # Activation still requires the signed policy record; this only says where
      # the route would point if it is.
      HONEYPOT_UPSTREAM: http://honeypot:8088
    # The control plane exposes POST /operations/scan, which runs the collectors
    # in-process, so it needs the same view of the repositories the worker has.
    #
    # Read-only. The collector reads source and git history to attribute an
    # endpoint to a team; nothing in SENTRY has a reason to write to a scanned
    # repository, and mounting it writable would make that a possibility rather
    # than a guarantee.
    volumes: &collectorvols
      - ../../estate/repos:/repos:ro
      - ../../estate/registry:/registry:ro
      - ../../estate/hr-stub:/hr:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      db-migrate: { condition: service_completed_successfully }
    # 8080, because Kong's proxy listener owns 8000. Both mapped to 8000 meant
    # `docker compose up` failed on whichever started second.
    ports: ["8080:8000"]
    networks: [sentry-net]
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx;httpx.get('http://localhost:8000/readyz').raise_for_status()"]
      interval: 10s
      # The API verifies the whole audit chain at boot, which takes longer on a
      # populated database than a liveness probe should allow.
      start_period: 40s
      retries: 6

  worker:
    build: { context: ../.., dockerfile: worker/Dockerfile }
    command: ["celery", "-A", "sentry_worker.tasks", "worker", "-l", "info", "-Q", "sentry"]
    environment: *svcenv
    volumes: *collectorvols
    depends_on:
      api: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    networks: [sentry-net]

  beat:
    build: { context: ../.., dockerfile: worker/Dockerfile }
    command: ["celery", "-A", "sentry_worker.tasks", "beat", "-l", "info"]
    environment: *svcenv
    depends_on:
      worker: { condition: service_started }
    networks: [sentry-net]
    # Exactly one. Two schedulers would double-run every stage.
    deploy:
      replicas: 1

  # Deliberately not ordered after the api, which is what writes the vclock row
  # this service needs to stamp an observation. Making the hot-path writer wait
  # on the control plane would couple an availability requirement to a
  # convenience one. Instead ingest reports itself unready until the clock is
  # readable and refuses batches with a 503 while it is not, so the agent holds
  # them and redelivers. A cold start therefore loses nothing regardless of
  # which container wins the race.
  ingest:
    build: { context: ../.., dockerfile: ingest/Dockerfile }
    environment: *svcenv
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["9090:9090"]
    networks: [sentry-net]

  honeypot:
    build: { context: ../.., dockerfile: honeypot/Dockerfile }
    environment: *svcenv
    ports: ["8088:8088"]
    networks: [sentry-net]

  agent:
    build: { context: ../.., dockerfile: agent/Dockerfile }
    # The one privileged container in the system. It has no listener, accepts no
    # inbound connection, and has exactly one egress target.
    privileged: true
    pid: host
    # The agent resolves a task's cgroup id by reading /proc/<pid>/cgroup and
    # stat-ing the corresponding directory under /sys/fs/cgroup. In its own
    # cgroup namespace those paths are relative to the agent's cgroup, so the
    # directory does not exist and the id cannot be resolved — the BPF filter
    # then drops every event from that task. Capture was partial and the only
    # signal was a warning per pid.
    cgroup: host
    environment:
      INGEST_ENDPOINT: ingest:9090
      # Empty by default, and that is deliberate.
      #
      # The cgroup path format is not portable: Docker Desktop's LinuxKit VM
      # reports `/../<id>`, the cgroupfs driver reports `/docker/<id>`, systemd
      # reports `/system.slice/docker-<id>.scope`. A default of `/docker`
      # matched none of the estate here, so the agent attached to zero targets
      # and reported no error — a sensor silently observing nothing, which is
      # the worst way for this component to fail. attach.go documents the same
      # defect; the default here reintroduced it from configuration.
      #
      # The approver ports do the real narrowing. This is an optional filter for
      # deployments that need to exclude co-tenants on a shared node.
      TARGET_CGROUP_PREFIX: ${TARGET_CGROUP_PREFIX:-}
      # The estate serves TLS on 8443 and nothing else here does.
      #
      # 443 was in this list and the agent duly captured the platform's own pip
      # downloads during `docker compose build`, registering 277 PyPI paths as
      # bank endpoints — SENTRY observing its own supply chain and reporting it
      # as the estate. The approver ports are the deployment's statement of what
      # is worth watching, so the fix belongs here rather than in a filter that
      # tries to recognise package registries.
      APPROVER_PORTS: "${APPROVER_PORTS:-8443}"
      BTF_PATH: ${BTF_PATH:-/sys/kernel/btf/vmlinux}
    volumes:
      - /sys/kernel/debug:/sys/kernel/debug:rw
      - /sys/kernel/btf:/sys/kernel/btf:ro
      - /sys/fs/bpf:/sys/fs/bpf:rw
      - /proc:/host/proc:ro
      - agentqueue:/var/lib/sentry/queue
    ulimits:
      memlock: -1
    depends_on:
      ingest: { condition: service_started }
    networks: [sentry-net]

  console:
    build:
      context: ../../console
      dockerfile: Dockerfile
      # Baked at build time — Vite substitutes VITE_* at compile time, so this
      # cannot be an `environment:` entry on a static bundle. 8080 is the API's
      # published port; 8000 is Kong's proxy listener, and pointing the console
      # there sent every control-plane call to the gateway under test.
      args:
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8080}
    ports: ["5173:80"]
    depends_on:
      api: { condition: service_healthy }
    networks: [sentry-net]
