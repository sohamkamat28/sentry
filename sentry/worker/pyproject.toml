[project]
name = "sentry-worker"
version = "0.1.0"
description = "SENTRY analysis engines, collectors, actuators and tasks."
requires-python = ">=3.12"
dependencies = ["sentry-core"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sentry_worker*"]
