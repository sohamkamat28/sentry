name: Publish the console to GitHub Pages

# The published site is a recording. `tools/snapshot.py` captures a real run of
# the control plane into `console/public/data/snapshot.json`, and that file is
# committed — so this workflow never needs the stack, a database, or a
# privileged host to build the site. Re-record by running the script locally
# against a live stack and committing the result.

on:
  push:
    branches: [main]
    paths:
      - "sentry/console/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sentry/console
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sentry/console/package-lock.json

      - run: npm ci

      # The gates that keep the published site honest: the types must still
      # match what the recording contains, and the suite must pass.
      - run: npx tsc --noEmit
      - run: npx vitest run

      - name: Fail if the recording is missing
        run: test -s public/data/snapshot.json

      # A view that reads a route the capture omitted renders
      # `not in the recording` in place of its content — and only once
      # published, because a developer with the stack up never sees it. This
      # reads the routes back out of the source and fails the build instead.
      - name: Fail if a view reads a route the recording lacks
        working-directory: sentry
        run: python3 tools/check_snapshot_routes.py

      # VITE_STATIC makes the client read the recording instead of the network.
      # VITE_OIDC_ISSUER is deliberately unset, so the auth gate passes through
      # and a first-time visitor is never asked to sign in to read a recording.
      # VITE_BASE must match the Pages project path — the site is served from
      # `/<repo>/`, and without it every asset 404s into a blank page.
      - run: VITE_STATIC=1 VITE_BASE="/${GITHUB_REPOSITORY#*/}/" npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: sentry/console/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
